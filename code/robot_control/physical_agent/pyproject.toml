[project]
name = "physical_agent"
version = "0.1.0"
description = "physical-agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.175.0,<1.0.0",
]

[project.scripts]
physical_agent = "physical_agent.main:run"
run_crew = "physical_agent.main:run"
train = "physical_agent.main:train"
replay = "physical_agent.main:replay"
test = "physical_agent.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
